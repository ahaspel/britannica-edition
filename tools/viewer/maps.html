<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encyclop&aelig;dia Britannica, 11th Edition &mdash; Colour Maps</title>
  <style>
    :root {
      --bg: #f5f1eb;
      --panel: #fdfcf9;
      --text: #2c2416;
      --muted: #6b5e4f;
      --border: #d4cab8;
      --link: #7b3f00;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .page { max-width: 960px; margin: 0 auto; padding: 24px; }
    .card { background: var(--panel); border: 1px solid var(--border);
      border-radius: 2px; padding: 20px 24px; margin-bottom: 20px; }
    .nav-link { color: var(--link); text-decoration: none; font-size: 0.95rem; }
    .nav-link:hover { text-decoration: underline; }
    h2 { margin: 0 0 6px; font-size: 1.15rem; font-variant: small-caps;
      letter-spacing: 0.04em; }
    .subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 16px; }
    .subtitle a { color: var(--link); }
    .map-figure { text-align: center; margin: 0 0 6px; }
    .map-figure img { max-width: 100%; border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.12); }
    .caption { color: var(--muted); font-size: 0.9rem; text-align: center;
      margin: 8px 0 0; }
    .caption a { color: var(--link); }
    .notice { color: var(--muted); font-style: italic; }
    .footer { color: var(--muted); font-size: 0.85rem; margin-top: 20px;
      text-align: center; }
  </style>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/article-urls.js"></script>
</head>
<body>
<div class="page">
  <div class="card">
    <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;">
      <h1 style="margin: 0; font-size: 1.3rem; color: #5c4a32;"><a href="/home.html" style="color: inherit; text-decoration: none;"><svg viewBox="0 0 32 32" width="32" height="32" style="vertical-align: middle; margin-right: 10px;" aria-hidden="true"><rect x="1" y="1" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1"/><rect x="3.5" y="3.5" width="25" height="25" fill="none" stroke="currentColor" stroke-width="0.6"/><text x="16" y="22" text-anchor="middle" font-family="Georgia, serif" font-size="16" fill="currentColor" style="letter-spacing:-0.3px">EB</text></svg><span id="page-title" style="font-variant: small-caps; letter-spacing: 0.06em;">Colour Maps</span> <span style="font-variant: normal; font-style: italic; letter-spacing: 0.02em;">&mdash; 11th Edition</span></a></h1>
      <div style="font-size: 0.9rem;">
        <a href="/index.html" class="nav-link">Articles</a>
        &nbsp;&middot;&nbsp;
        <a href="/contributors.html" class="nav-link">Contributors</a>
        &nbsp;&middot;&nbsp;
        <a href="/topics.html" class="nav-link">Topics</a>
        &nbsp;&middot;&nbsp;
        <a href="/ancillary.html" class="nav-link">Ancillary</a>
        &nbsp;&middot;&nbsp;
        <a href="/download.html" class="nav-link">Download</a>
      </div>
    </div>
    <div style="font-size: 0.9rem; margin-bottom: 4px;">
      <a class="nav-link" href="/ancillary.html#maps">&larr; All colour maps</a>
    </div>
  </div>

  <div id="content"></div>

  <div class="footer">
    EB1911 plates engraved by Justus Perthes, Gotha.  Stieler Hand-Atlas
    masters courtesy of the David Rumsey Map Collection.
  </div>
</div>
<script>
  // Single-map display surface.  #<id> shows one registry row (the EB1911
  // plate + the Stieler where we have it); no hash belongs on the ancillary
  // panel instead — redirect there.  The registry (/data/maps.json) is the
  // one source of truth; this page just shows what it says.
  const IMG_BASE = "/data/images/maps/";
  const content = document.getElementById("content");
  const esc = s => String(s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  function card(inner) { return `<div class="card">${inner}</div>`; }

  function figure(imgFile, fullFile, alt, captionHtml) {
    const full = IMG_BASE + encodeURIComponent(fullFile || imgFile);
    return `<div class="map-figure">
      <a href="${full}" title="Open full resolution"><img src="${IMG_BASE + encodeURIComponent(imgFile)}" alt="${esc(alt)}"></a>
      <div class="caption">${captionHtml} &middot; <a href="${full}">full resolution</a></div>
    </div>`;
  }

  function renderMap(row, index) {
    document.getElementById("page-title").textContent = row.title;
    const arts = (row.articles || []).map(stem => {
      const meta = index.get(stem);
      const title = meta ? meta.title : stem;
      return `<a href="${BritannicaUrls.filenameToUrl(stem + ".json", title)}">${esc(title)}</a>`;
    }).join(", ");
    const cards = [];
    const eb = row.eb1911;
    if (eb && eb.quality !== "broken") {
      cards.push(card(`<h2>${esc(row.title)}</h2>
        <div class="subtitle">${arts ? "Map for " + arts + " &middot; " : ""}as printed in the Eleventh Edition</div>` +
        figure(eb.file, eb.full, `${row.title} — EB1911 colour map`,
               "Drawn and engraved by Justus Perthes, Gotha")));
    }
    const st = row.stieler;
    if (st) {
      const rel = st.derived === false
        ? "The Stieler map of the same region"
        : "The Stieler original";
      const sheets = (st.sheets && st.sheets.length) ? st.sheets : [st];
      for (const sheet of sheets) {
        cards.push(card(`<h2>${rel}</h2>
          <div class="subtitle"><i>${esc(sheet.title)}</i>, Stielers Hand-Atlas No. ${esc(sheet.nr)} (Gotha: Justus Perthes)</div>` +
          figure(sheet.file, sheet.full, `Stieler ${sheet.title}`,
                 "David Rumsey Map Collection")));
      }
    }
    if (eb && eb.quality === "broken" && st) {
      cards.push(card(`<div class="notice">A good scan of the EB1911 printing of this
        map is still wanted; the Stieler original above is shown in the meantime.</div>`));
    }
    if (!cards.length) {
      cards.push(card(`<div class="notice">No scan of this map is on hand yet.</div>`));
    }
    content.innerHTML = cards.join("\n");
  }

  async function main() {
    const [reg, idx] = await Promise.all([
      fetch("/data/maps.json").then(r => r.json()).catch(() => ({ maps: [] })),
      fetch("/data/articles/index.json").then(r => r.json()).catch(() => []),
    ]);
    const index = new Map();
    for (const a of idx) {
      index.set(String(a.filename || "").replace(/\.json$/, ""), a);
    }
    const maps = reg.maps || [];
    function route() {
      const id = decodeURIComponent((location.hash || "").replace(/^#/, ""));
      const row = maps.find(m => m.id === id);
      if (!row) {
        location.replace("/ancillary.html#maps");
        return;
      }
      renderMap(row, index);
      window.scrollTo(0, 0);
    }
    window.addEventListener("hashchange", route);
    route();
  }
  main();
</script>
<script src="/gc-gate.js"></script>

</body>
</html>
