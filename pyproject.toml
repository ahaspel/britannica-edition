[project]
name = "britannica-edition"
license = "MIT"
license-files = ["LICENSE"]
version = "0.1.0"
description = "The Encyclopaedia Britannica, Eleventh Edition, as a faithful digital scholarly edition — the book wikikit builds at britannica11.org"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  # The engine.  A local editable checkout until wikikit is published — see
  # [tool.uv.sources].  `mdx`: the dictionary builds need mdict-utils.
  "wikikit[mdx]",
  # Imported directly by the book's own code and tools, so declared here too,
  # not left to arrive through wikikit.
  "sqlalchemy>=2.0",
  "html5lib>=1.1",
  "numpy>=1.26",
  "pillow>=10",
  "requests>=2.33.0",
  "anthropic>=1.9.0",
]

[tool.uv.sources]
wikikit = { path = "../wikikit", editable = true }

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
# Scope collection to the real suite.  Without this a bare `pytest` walks the
# whole tree and collects stray `test_*.py` scratch scripts under tools/_scratch
# (some reassign sys.stdout / do heavy corpus+DB work), which hangs for minutes
# and errors during collection.  `pytest` and `pytest tests/` now behave the same.
testpaths = ["tests"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "playwright>=1.58.0",
    "pytest>=9.0.2",
]
